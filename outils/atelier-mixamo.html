<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier Mixamo · Sergent-Chef</title>
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Atelier : rend une animation Mixamo du Sergent-Chef (GLB animé) sur fond blanc, vu de profil, en style cartoon.
// ?f=fichier.glb · ?sol=1 (montre une grille) · window.poserT(t 0..1) dessine l'image, window.duree = longueur du clip.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q=new URLSearchParams(location.search);
const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.setSize(W,H);document.body.appendChild(renderer.domElement);
renderer.shadowMap.enabled=true;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
const camera=new THREE.PerspectiveCamera(28,W/H,0.1,60);
scene.add(new THREE.HemisphereLight(0xffffff,0x9a9a9a,1.5));
const sol=new THREE.DirectionalLight(0xffffff,1.4);sol.position.set(1.5,6,2);sol.castShadow=true;sol.shadow.mapSize.set(1024,1024);
Object.assign(sol.shadow.camera,{left:-2,right:2,top:2,bottom:-2});scene.add(sol);
const ombre=new THREE.Mesh(new THREE.PlaneGeometry(8,8),new THREE.ShadowMaterial({opacity:.18}));ombre.rotation.x=-Math.PI/2;ombre.receiveShadow=true;scene.add(ombre);
if(q.has('sol')){const g=new THREE.GridHelper(4,40,0xcc3333,0xdddddd);scene.add(g)}
const tons=new THREE.DataTexture(new Uint8Array([125,125,125,255,205,205,205,255,255,255,255,255]),3,1);tons.minFilter=tons.magFilter=THREE.NearestFilter;tons.needsUpdate=true;
const contourMat=ep=>{const m=new THREE.MeshBasicMaterial({color:0x111111,side:THREE.BackSide});m.onBeforeCompile=sh=>{sh.vertexShader=sh.vertexShader.replace('#include <project_vertex>','transformed += normalize(normal)*'+ep.toFixed(4)+';\n#include <project_vertex>')};return m};
let mixer=null,clip=null,modele=null;
new GLTFLoader().load(q.get('f')||'pompes.glb',g=>{
  modele=g.scene;const aj=[];
  modele.traverse(o=>{if(!o.isMesh)return;const carte=o.material.map||null;o.material=new THREE.MeshToonMaterial({color:carte?0xffffff:o.material.color,map:carte,gradientMap:tons});o.castShadow=true;
    const ol=o.isSkinnedMesh?new THREE.SkinnedMesh(o.geometry,contourMat(0.008)):new THREE.Mesh(o.geometry,contourMat(0.008));if(o.isSkinnedMesh)ol.bind(o.skeleton,o.bindMatrix);
    ol.position.copy(o.position);ol.quaternion.copy(o.quaternion);ol.scale.copy(o.scale);aj.push([o.parent,ol]);o.frustumCulled=ol.frustumCulled=false});
  aj.forEach(([p,o])=>p.add(o));scene.add(modele);
  clip=g.animations[0];mixer=new THREE.AnimationMixer(modele);mixer.clipAction(clip).play();window.duree=clip.duration;
  // cadrage : on mesure le personnage sur tout le clip
  // la boîte d'un maillage animé ne bouge pas avec le squelette : on mesure les os, sur tout le clip
  const os=[];modele.traverse(x=>{if(x.isBone)os.push(x)});const B=new THREE.Box3(),_p=new THREE.Vector3();
  for(let i=0;i<=24;i++){mixer.setTime(clip.duration*i/24);modele.updateMatrixWorld(true);os.forEach(b=>B.expandByPoint(b.getWorldPosition(_p)))}
  B.expandByScalar(0.16);
  const c=B.getCenter(new THREE.Vector3()),s=B.getSize(new THREE.Vector3());window.boite={c:c.toArray(),s:s.toArray()};
  // vue de profil (depuis +x), le personnage remplit l'image
  const t=Math.tan(THREE.MathUtils.degToRad(14)),dist=Math.max(s.y/(2*t),s.z/(2*t*W/H))*1.08*(+q.get('zoom')||1);
  if(q.get('vue')==='face'){const df=Math.max(s.y/(2*t),s.x/(2*t*W/H))*1.08*(+q.get('zoom')||1);camera.position.set(c.x+df*0.18,c.y+df*0.1,c.z+df);camera.lookAt(c.x,c.y,c.z)}
  else if(q.get('vue')==='34'){const d=dist*0.9;camera.position.set(c.x+d*0.72,c.y+d*0.3,c.z+d*0.62);camera.lookAt(c.x,c.y,c.z)}
  else{camera.position.set(c.x+dist,c.y+dist*0.12,c.z+dist*0.08);camera.lookAt(c.x,c.y,c.z)}
  window.pret=true;poserT(0);
});
function poserT(t){if(!mixer)return;mixer.setTime(((t%1)+1)%1*clip.duration);renderer.render(scene,camera)}
window.poserT=poserT;
let t0=null;function boucle(t){requestAnimationFrame(boucle);if(q.has('fige')||!clip)return;t0=t0??t;poserT(((t-t0)/1000)/clip.duration)}requestAnimationFrame(boucle);
</script>
</body>
</html>
