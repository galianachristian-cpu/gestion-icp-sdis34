// Face ID / Touch ID : clé de l'appareil, déverrouillée par la biométrie
async function bioAvail(){ try{ return !!(window.PublicKeyCredential && window.isSecureContext && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }catch(e){ return false; } }
async function bioEnroll(pid){
  const nom = (PROFILES.find(p => p.id === pid) || {}).nom || pid;
  const c = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Mon Programme' }, user: { id: new TextEncoder().encode(pid), name: nom, displayName: nom },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } });
  lockPut(pid, Object.assign({}, lockOf(pid), { cred: b64(c.rawId) }));
}
async function bioCheck(pid){
  const L = lockOf(pid); if (!L || !L.cred) return false;
  const a = await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: unb64(L.cred) }], userVerification: 'required', timeout: 60000 } });
  return !!a;
}
// écran de verrouillage
let lockState = null, hiddenAt = 0;
function showLock(pid, onOk, cancelable){
  lockState = { pid, onOk, cancelable, buf: '' };
  let el = $('#lock'); if (!el){ el = document.createElement('div'); el.id = 'lock'; el.className = 'lock'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); document.body.appendChild(el); }
  paintLock(); document.body.classList.add('locked');
  const L = lockOf(pid); if (L && L.cred) setTimeout(() => lockBio(true), 350);
}
function paintLock(msg){
  const { pid, buf, cancelable } = lockState, L = lockOf(pid) || {}, p = PROFILES.find(x => x.id === pid) || profile, n = L.n || 4, wait = Math.max(0, Math.ceil(((L.until || 0) - Date.now()) / 1000));
  const others = PROFILES.filter(x => x.id !== pid);
  $('#lock').innerHTML = `<div class="lk-in">
    <span class="av big" style="--p1:${p.a1};--p2:${p.a2}">${esc(p.nom.slice(0, 1).toUpperCase())}</span>
    <h2>🔒 ${esc(p.nom)}</h2><p class="lk-msg" aria-live="polite">${msg || (wait ? `Trop d’essais : réessaie dans ${wait} s` : 'Entre ton code')}</p>
    <div class="lk-dots" aria-hidden="true">${Array.from({ length: n }, (_, i) => `<i class="${i < buf.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(d => `<button data-lk="${d}" ${wait ? 'disabled' : ''}>${d}</button>`).join('')}
      ${L.cred ? '<button data-lk="bio" aria-label="Face ID ou Touch ID">🙂</button>' : '<span></span>'}<button data-lk="0" ${wait ? 'disabled' : ''}>0</button><button data-lk="del" aria-label="Effacer">⌫</button></div>
    <div class="lk-foot">${others.map(o => `<button data-lkp="${o.id}">👤 ${esc(o.nom)}</button>`).join('')}${cancelable ? '<button data-lk="cancel">Annuler</button>' : ''}<button data-lk="forgot">Code oublié ?</button></div></div>`;
  if (wait) setTimeout(() => { if (lockState && lockState.pid === pid) paintLock(); }, 1000);
}
function hideLock(){ const el = $('#lock'); if (el) el.remove(); document.body.classList.remove('locked'); lockState = null; }
async function lockTry(){
  const st = lockState, pid = st.pid, L = lockOf(pid);
  if (await pinOk(pid, st.buf)){ lockPut(pid, Object.assign({}, lockOf(pid), { fail: 0, until: 0 })); const fn = st.onOk; hideLock(); if (fn) fn(); return; }
  const fail = (L.fail || 0) + 1, until = fail >= 5 ? Date.now() + 30e3 * Math.pow(2, Math.min(4, fail - 5)) : 0;
  lockPut(pid, Object.assign({}, L, { fail, until })); st.buf = '';
  if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
  paintLock(until ? null : `Code incorrect${fail >= 3 ? ` (${5 - fail} essai${5 - fail > 1 ? 's' : ''} avant attente)` : ''}`);
  $('#lock .lk-dots').classList.add('shake');
}
async function lockBio(auto){
  const st = lockState; if (!st) return;
  try{ if (await bioCheck(st.pid)){ const fn = st.onOk; hideLock(); if (fn) fn(); } }
  catch(e){ if (!auto && lockState) paintLock('Face ID indisponible : utilise ton code'); }
}
document.addEventListener('click', e => {
  if (!lockState) return; const b = e.target.closest('#lock [data-lk],#lock [data-lkp]'); if (!b || b.disabled) return;
  const st = lockState, k = b.dataset.lk;
  if (b.dataset.lkp){ const id = b.dataset.lkp; if (lockOf(id)) showLock(id, () => switchProfile(id, true), st.cancelable); else { hideLock(); switchProfile(id, true); } return; }
  if (k === 'del'){ st.buf = st.buf.slice(0, -1); paintLock(); return; }
  if (k === 'bio') return lockBio(false);
  if (k === 'cancel'){ hideLock(); return; }
  if (k === 'forgot'){ $('#lock .lk-in').innerHTML = `<h2>Code oublié ?</h2><p class="lk-msg" style="max-width:320px">On peut supprimer le code de ce profil sur ce téléphone. Tes données ne sont pas touchées ; tu pourras choisir un nouveau code dans la fenêtre des profils.</p><div class="lk-foot"><button data-lk="back">Retour</button><button data-lk="reset" class="danger">Supprimer le code</button></div>`; return; }
  if (k === 'back'){ paintLock(); return; }
  if (k === 'reset'){ lockPut(st.pid, null); location.reload(); return; }
  const L = lockOf(st.pid) || {}; if ((L.until || 0) > Date.now() || st.buf.length >= (L.n || 4)) return;
  st.buf += k; paintLock(); if (st.buf.length === (L.n || 4)) setTimeout(lockTry, 120);
});
document.addEventListener('keydown', e => { if (!lockState || !$('#lock .lk-pad')) return; if (/^\d$/.test(e.key)){ const b = $(`#lock [data-lk="${e.key}"]`); if (b) b.click(); } else if (e.key === 'Backspace'){ $('#lock [data-lk="del"]').click(); } });
// au retour dans l'appli après plus d'une minute : on reverrouille (et on masque l'écran dans le sélecteur d'apps)
document.addEventListener('visibilitychange', () => {
  if (!lockOf(profile.id)) return;
  if (document.hidden){ hiddenAt = Date.now(); document.body.classList.add('veil'); }
  else { document.body.classList.remove('veil'); if (!lockState && Date.now() - hiddenAt > LOCK_AFTER) showLock(profile.id, null, false); }
});
// réglages dans la fenêtre des profils
async function lockSection(){
  const L = lockOf(profile.id), bio = await bioAvail(), box = $('#lockSet'); if (!box) return;
  box.innerHTML = `<h3 class="sec">🔒 Verrouillage de ${esc(profile.nom)}</h3><div class="card">
    <p class="muted" style="font-size:13px;margin-bottom:10px">${L ? `Code à ${L.n} chiffres demandé à l’ouverture et après 1 min hors de l’appli.${L.cred ? ' Face ID / Touch ID activé.' : ''}` : 'Protège ce profil avec un code à l’ouverture de l’appli (gardé seulement sur ce téléphone).'}</p>
    <div class="row" style="flex-wrap:wrap;gap:8px">${L ? `<button class="btn sm" data-lks="change">🔁 Changer le code</button>${bio ? `<button class="btn sm" data-lks="bio">${L.cred ? '🚫 Désactiver Face ID' : '🙂 Activer Face ID / Touch ID'}</button>` : ''}<button class="btn sm danger" data-lks="off">Retirer le code</button>` : '<button class="btn pri sm" data-lks="on">🔒 Activer un code</button>'}</div></div>`;
  box.querySelectorAll('[data-lks]').forEach(b => b.onclick = () => lockAction(b.dataset.lks));
}
function pinForm(title, needOld, onDone){
  const L = lockOf(profile.id);
  openSheet(`<h2>${title}</h2><form id="pinF">
    ${needOld ? `<div class="fg"><label for="pinO">Code actuel</label><input id="pinO" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*" class="inp"></div>` : ''}
    ${onDone ? `<div class="fg"><label for="pinA">Nouveau code (4 à 6 chiffres)</label><input id="pinA" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*" class="inp"></div>
    <div class="fg"><label for="pinB">Confirme le code</label><input id="pinB" type="password" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]*" class="inp"></div>` : ''}
    <p class="muted" id="pinM" style="font-size:12.5px;min-height:18px"></p>
    <div class="row"><button type="button" class="btn" data-act="close">Annuler</button><span class="spacer"></span><button class="btn pri" type="submit">Valider</button></div></form>`);
  $('#pinF').onsubmit = async ev => {
    ev.preventDefault(); const msg = t => { $('#pinM').textContent = t; };
    if (needOld && !(await pinOk(profile.id, $('#pinO').value))) return msg('Code actuel incorrect.');
    if (!onDone){ lockPut(profile.id, null); closeSheet(); toast('🔓 Code retiré'); return; }
    const a = $('#pinA').value, b = $('#pinB').value;
    if (!/^\d{4,6}$/.test(a)) return msg('Le code doit faire 4 à 6 chiffres.');
    if (a !== b) return msg('Les deux codes ne sont pas identiques.');
    await setPin(profile.id, a); onDone();
  };
  setTimeout(() => { const f = $('#pinF input'); if (f) f.focus(); }, 300);
}
async function lockAction(k){
  if (k === 'on') pinForm('🔒 Choisir un code', false, async () => { closeSheet(); toast('🔒 Code activé'); if (await bioAvail()) setTimeout(() => sheetProfiles(), 400); });
  if (k === 'change') pinForm('🔁 Changer le code', true, () => { closeSheet(); toast('🔒 Nouveau code enregistré'); });
  if (k === 'off') pinForm('Retirer le code', true, null);
  if (k === 'bio'){
    const L = lockOf(profile.id);
    if (L.cred){ const n = Object.assign({}, L); delete n.cred; lockPut(profile.id, n); toast('Face ID désactivé'); lockSection(); return; }
    try{ await bioEnroll(profile.id); toast('🙂 Face ID / Touch ID activé'); }catch(e){ toast('Face ID non activé'); }
    lockSection();
  }
}

// version de l'appli (affichée dans la fenêtre des profils) et mise à jour automatique
const APP_VERSION = 84;
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || G || DU) return; reloaded = true; location.reload(); });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {}));
}
(async function init(){
  applyTheme(); applyProfileTheme();
  if (lockOf(profile.id)) showLock(profile.id, null, false);
  T.total = T.left = settings.preset;
  currentDay = todayIdx();
  render();
  await load();
  render();
  const on = document.querySelector('.day.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
  setTimeout(remCheck, 3000);
  if (/deploy-preview/.test(location.hostname)) setTimeout(() => toast('⚠️ Version d’aperçu figée : ouvre l’adresse principale de l’appli'), 2500);
})();
</script>
